name: rms

services:
  postgres:
    image: postgres:16-alpine
    container_name: rms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_db}
      POSTGRES_USER: ${POSTGRES_USER:-rms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rms_user} -d ${POSTGRES_DB:-restaurant_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rms-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rms-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-restaurant_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rms_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
      JWT_SECRET: ${JWT_SECRET:-rms_it3180_prod_docker_secret_key_at_least_32_bytes}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      VIETQR_BANK_BIN: ${VIETQR_BANK_BIN:-970415}
      VIETQR_ACCOUNT_NUMBER: ${VIETQR_ACCOUNT_NUMBER:-113366668888}
      VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME:-NHA HANG DEMO IT3180}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - rms-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_WS_URL: /ws
    container_name: rms-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - rms-net

volumes:
  rms_pg_data:

networks:
  rms-net:
    driver: bridge
