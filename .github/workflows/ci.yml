name: IT3180 CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  repo-hygiene:
    name: SCM & Repository Hygiene Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required baseline documents exist
        run: |
          for file in \
            README.md \
            LICENSE \
            CHANGELOG.md \
            .env.example \
            docs/01-project-management/PROJECT_MANAGEMENT_PLAN.md \
            docs/01-project-management/PRODUCT_BACKLOG.md \
            docs/01-project-management/SCM_PLAN.md \
            docs/02-requirements/SRS_v1.0.md; do
            if [ ! -s "$file" ]; then
              echo "ERROR: Missing or empty required file: $file"
              exit 1
            fi
          done
          echo "All required SCM & Sprint 1 documents are present and non-empty."

      - name: Check for junk files and oversized binaries (>10MB)
        run: |
          JUNK_FILES=$(find . -maxdepth 5 -not -path './.git/*' \( -name '.DS_Store' -o -iname 'desktop.ini' -o -name 'Thumbs.db' \))
          if [ -n "$JUNK_FILES" ]; then
            echo "ERROR: Forbidden OS junk files found:"
            echo "$JUNK_FILES"
            exit 1
          fi

          LARGE_FILES=$(find . -not -path './.git/*' -type f -size +10M)
          if [ -n "$LARGE_FILES" ]; then
            echo "ERROR: Files larger than 10MB must not be committed to Git:"
            echo "$LARGE_FILES"
            exit 1
          fi
          echo "Repository hygiene check passed."

  backend-ci:
    name: Backend Build & Test (Spring Boot + JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if backend is initialized
        id: check_be
        run: |
          if [ -f backend/pom.xml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "backend/pom.xml not found yet (Sprint 1 phase). Skipping backend CI cleanly."
          fi

      - name: Set up JDK 17
        if: steps.check_be.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests with Maven
        if: steps.check_be.outputs.exists == 'true'
        working-directory: backend
        run: |
          if [ -x ./mvnw ]; then
            ./mvnw -B verify
          else
            mvn -B verify
          fi

  frontend-ci:
    name: Frontend Lint, Test & Build (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if frontend is initialized
        id: check_fe
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "frontend/package.json not found yet (Sprint 1 phase). Skipping frontend CI cleanly."
          fi

      - name: Set up Node.js 20
        if: steps.check_fe.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies, lint, test, and build
        if: steps.check_fe.outputs.exists == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build
