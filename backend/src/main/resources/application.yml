server:
  port: ${SERVER_PORT:18080}

spring:
  application:
    name: rms-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/restaurant_db}
    username: ${SPRING_DATASOURCE_USERNAME:rms_user}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me_strong_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:rms_it3180_default_dev_secret_key_at_least_32_bytes_long}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  vietqr:
    bank-bin: ${VIETQR_BANK_BIN:970415}
    account-number: ${VIETQR_ACCOUNT_NUMBER:113366668888}
    account-name: ${VIETQR_ACCOUNT_NAME:NHA HANG DEMO IT3180}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
